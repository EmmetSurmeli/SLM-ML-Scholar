[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "localml-scholar"
version = "1.1.1"
description = "From-scratch local language-model foundations for research-paper assistance"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "LocalML Scholar contributors" },
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
app = [
  "pypdf>=5.0,<7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
localml-scholar-evaluate = "localml_scholar.evaluation.cli:main"
localml-scholar-review = "localml_scholar.review_app.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"localml_scholar.review_app" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
